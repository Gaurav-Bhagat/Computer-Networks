<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        <div class="actions">
            <button onclick="showAddForm()">Add Student</button>
            <button onclick="showSearchForm()">Search Student</button>
            <button onclick="showDisplayAll()">Display All Students</button>
            <button onclick="showDeleteForm()">Delete Student</button>
        </div>

        <!-- Add Student Form -->
        <div id="addStudentForm" class="form-container">
            <h2>Add Student</h2>
            <form id="addStudent">
                <label for="roll">Roll Number:</label>
                <input type="number" id="roll" name="roll" required><br>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required><br>
                <label for="phone">Phone:</label>
                <input type="text" id="phone" name="phone" required><br>
                <label for="dept">Department:</label>
                <select id="dept" name="dept" required>
                    <option value="">Select Department</option>
                </select><br>
                <button type="button" onclick="addStudent()">Save</button>
                <button type="button" onclick="cancelForm('addStudentForm')">Cancel</button>
            </form>
        </div>

        <!-- Search Student Form -->
        <div id="searchStudentForm" class="form-container">
            <h2>Search Student</h2>
            <label for="searchRoll">Roll Number:</label>
            <input type="number" id="searchRoll">
            <button onclick="searchStudent()">Search</button>
            <div id="studentDetails"></div>
            <button type="button" onclick="cancelForm('searchStudentForm')">Cancel</button>
        </div>

        <!-- Display All Students -->
        <div id="displayAllForm" class="form-container">
            <h2>Display All Students</h2>
            <div id="studentList"></div>
            <button type="button" onclick="cancelForm('displayAllForm')">Close</button>
        </div>

        <!-- Delete Student Form -->
        <div id="deleteStudentForm" class="form-container">
            <h2>Delete Student</h2>
            <label for="deleteRoll">Roll Number:</label>
            <input type="number" id="deleteRoll">
            <button onclick="deleteStudent()">Delete</button>
            <button type="button" onclick="cancelForm('deleteStudentForm')">Cancel</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
